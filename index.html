<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Skate 3 - Mega Ramp Sandbox</title>
    <style>
        body { margin: 0; overflow: hidden; background: #07080c; font-family: sans-serif; user-select: none; }
        #u { position: absolute; top: 20px; left: 20px; color: #fff; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 6px; border: 1px solid #00ffcc; z-index: 10; pointer-events: none; }
        h1 { margin: 0 0 5px 0; font-size: 16px; color: #00ffcc; letter-spacing: 1px; }
        .hint { font-size: 12px; color: #ccc; margin: 3px 0; }
        #t { position: absolute; bottom: 40px; width: 100%; text-align: center; color: #00ffcc; font-size: 44px; font-weight: 900; letter-spacing: 2px; pointer-events: none; }
        #speed { position: absolute; bottom: 40px; right: 40px; background: rgba(0,0,0,0.85); color: #fff; padding: 10px 20px; border-radius: 30px; font-weight: bold; font-size: 20px; border: 1px solid #00ffcc; }
    </style>
</head>
<body>
    <div id="u">
        <h1>SUPER ULTRA MEGA RAMP v5.0</h1>
        <div class="hint">⌨️ STEER: A / D Keys</div>
        <div class="hint">🛹 PUSH: W Key or Spacebar</div>
        <div class="hint">🎯 FLIP TRICKS: Keyboard Arrow Keys</div>
        <div class="hint">🔄 RESET: Press 'R' to respawn at the top</div>
    </div>
    <div id="speed"><span id="sp-val">0</span> MPH</div>
    <div id="t">DROP IN!</div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resize);
        resize();

        // Skater positioning and momentum state tracking
        const skater = {
            x: 0, y: 71, z: -110,
            vx: 0, vy: 0, vz: 0,
            angleY: 0, flipRot: 0,
            isGrounded: true, pushCool: 0
        };

        const keys = { w:0, a:0, d:0, space:0, ArrowUp:0, ArrowDown:0, ArrowLeft:0, ArrowRight:0 };
        let arrowY = 0, arrowX = 0, pArrowY = 0, pArrowX = 0;

        window.onkeydown = (e) => {
            if (e.key === ' ') keys.space = 1;
            else if (e.key in keys) keys[e.key] = 1;
            else if (e.key.toLowerCase() === 'w') keys.w = 1;
            else if (e.key.toLowerCase() === 'a') keys.a = 1;
            else if (e.key.toLowerCase() === 'd') keys.d = 1;
            else if (e.key.toLowerCase() === 'r') reset();
        };

        window.onkeyup = (e) => {
            if (e.key === ' ') keys.space = 0;
            else if (e.key in keys) keys[e.key] = 0;
            else if (e.key.toLowerCase() === 'w') keys.w = 0;
            else if (e.key.toLowerCase() === 'a') keys.a = 0;
            else if (e.key.toLowerCase() === 'd') keys.d = 0;
        };

        function reset() {
            skater.x = 0; skater.y = 71; skater.z = -110;
            skater.vx = 0; skater.vy = 0; skater.vz = 0;
            skater.angleY = 0; skater.flipRot = 0; skater.isGrounded = true;
            document.getElementById("t").innerText = "DROP IN!";
        }

        // Height Map tracking coordinates for the map
        function getTrackHeight(x, z) {
            if (Math.abs(x) > 26) return -50; 
            if (z >= -150 && z < -80) return 71; 
            if (z >= -80 && z < 70) return 71 - (((z + 80) / 150) * 71); // Massive Roll-In Hill
            if (z >= 70 && z < 145) return 0; // Flat Runway
            if (z >= 145 && z < 185) return ((z - 145) / 40) * 9; // Kicker Ramp
            if (z >= 185 && z < 260) return -50; // Mega Gap Void
            if (z >= 260 && z < 360) return 2.5 - (((z - 260) / 100) * 14.5); // Landing Box
            if (z >= 360 && z < 450) return -12; 
            if (z >= 450 && z < 495) return -12 + (((z - 450) / 45) * 28); // Quarterpipe Wall
            return -50;
        }

        // Mathematical projection engine mapping raw space vectors down onto 2D screens
        function project3D(x, y, z, rotY) {
            let cx = x - skater.x;
            let cy = y - (skater.y + 4.5);
            let cz = z - (skater.z - 10);

            let cos = Math.cos(-rotY);
            let sin = Math.sin(-rotY);
            let rx = cx * cos - cz * sin;
            let rz = cx * sin + cz * cos;

            if (rz <= 1) return null; 

            let fov = 400; 
            return {
                x: (canvas.width / 2) + (rx * fov) / rz,
                y: (canvas.height / 2) - (cy * fov) / rz,
                scale: fov / rz
            };
        }

        function loop() {
            requestAnimationFrame(loop);

            pArrowY = arrowY; pArrowX = arrowX;
            arrowY = keys.ArrowUp ? -1 : (keys.ArrowDown ? 1 : 0);
            arrowX = keys.ArrowLeft ? -1 : (keys.ArrowRight ? 1 : 0);

            // Flick Trick Recognition Engine
            if (skater.isGrounded) {
                if (pArrowY > 0.1 && arrowY < -0.1) { skater.vy = 14; skater.isGrounded = false; document.getElementById("t").innerText = "MEGA OLLIE"; }
                else if (pArrowX > -0.1 && arrowX < -0.4) { skater.vy = 11; skater.isGrounded = false; skater.flipRot = 35; document.getElementById("t").innerText = "KICKFLIP"; }
                else if (pArrowX < 0.1 && arrowX > 0.4) { skater.vy = 11; skater.isGrounded = false; skater.flipRot = -35; document.getElementById("t").innerText = "HEELFLIP"; }
            }

            let steer = keys.a ? -1 : (keys.d ? 1 : 0);
            skater.angleY -= steer * 0.035;

            let headingX = Math.sin(skater.angleY);
            let headingZ = Math.cos(skater.angleY);

            if ((keys.w || keys.space) && skater.isGrounded && skater.pushCool <= 0) {
                skater.vx += headingX * 4;
                skater.vz += headingZ * 4;
                skater.pushCool = 25;
            }
            if (skater.pushCool > 0) skater.pushCool--;

            // Downhill gravity acceleration tracking
            if (skater.isGrounded && skater.z > -80 && skater.z < 70) {
                skater.vz += 0.42; 
            }

            let fCoeff = skater.isGrounded ? 0.98 : 0.995;
            skater.vx *= fCoeff;
            skater.vz *= fCoeff;

            if (!skater.isGrounded) skater.vy -= 0.35; 

            skater.x += skater.vx * 0.16;
            skater.y += skater.vy * 0.16;
            skater.z += skater.vz * 0.16;

            let floorY = getTrackHeight(skater.x, skater.z);
            if (skater.y <= floorY) {
                skater.y = floorY;
                skater.vy = 0;
                skater.isGrounded = true;
                skater.flipRot = 0;
            } else if (skater.y > floorY + 0.2) {
                skater.isGrounded = false;
            }

            let mph = Math.floor(Math.abs(skater.vz) * 2.2);
            document.getElementById("sp-val").innerText = mph;

            // --- DRAW ENGINE ---
            ctx.fillStyle = "#07080c";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw track grid boundaries
            ctx.strokeStyle = "rgba(0, 255, 204, 0.25)";
            ctx.lineWidth = 1.5;

            for (let z = -130; z <= 500; z += 12) {
                let leftP = project3D(-25, getTrackHeight(-25, z), z, skater.angleY);
                let rightP = project3D(25, getTrackHeight(25, z), z, skater.angleY);

                if (leftP && rightP && getTrackHeight(0, z) > -45) {
                    ctx.beginPath();
                    ctx.moveTo(leftP.x, leftP.y);
                    ctx.lineTo(rightP.x, rightP.y);
                    ctx.stroke();
                }
            }

            // Draw Skateboard model box
            let sProj = project3D(skater.x, skater.y + 0.1, skater.z, skater.angleY);
            if (sProj) {
                ctx.save();
                ctx.translate(sProj.x, sProj.y);
                if (!skater.isGrounded) {
                    ctx.rotate(Math.sin(Date.now() * 0.015) * skater.flipRot * 0.03);
                }
                
                // Red Deck base plate
                ctx.fillStyle = "#e11d48";
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.rect(-24 * sProj.scale * 0.012, -8 * sProj.scale * 0.012, 48 * sProj.scale * 0.012, 16 * sProj.scale * 0.012);
                ctx.fill();
                ctx.stroke();

                // Grip tape insert
                ctx.fillStyle = "#181a21";
                ctx.fillRect(-20 * sProj.scale * 0.012, -6 * sProj.scale * 0.012, 40 * sProj.scale * 0.012, 12 * sProj.scale * 0.012);
                ctx.restore();
            }
        }

        loop();
    </script>
</body>
</html>
